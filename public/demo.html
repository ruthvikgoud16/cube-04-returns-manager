<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTN · Reviewer walkthrough</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink:#f0ebe4; --muted:#9aa3b5; --line:#2a3144; --paper:#0b0d14; --card:#161a26; --mark:#e39a6a;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; }
    body { display:flex; flex-direction:column; font:15px/1.45 "Source Sans 3", system-ui, sans-serif; color:var(--ink); background:var(--paper); }
    header { flex:0 0 auto; border-bottom:1px solid var(--line); background:rgba(22,26,38,.96); padding:14px 18px 12px; }
    .brand { font:800 22px/1 Sora, sans-serif; letter-spacing:-0.03em; }
    .brand span { display:block; margin-top:3px; font:600 11px/1 "Source Sans 3", sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    h1 { font:700 18px/1.25 Sora, sans-serif; margin:10px 0 6px; letter-spacing:-0.02em; }
    p { margin:0; max-width:78ch; }
    .meta { color:var(--muted); font-size:13px; margin-top:6px; }
    .row { display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
    button { background:linear-gradient(135deg,var(--mark),#c47a4a); color:#1a0e08; border:0; border-radius:999px; padding:10px 16px; cursor:pointer; font:700 14px/1.2 "Source Sans 3", sans-serif; }
    button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
    button:disabled { opacity:.45; cursor:default; }
    #count { font-size:13px; color:var(--muted); }
    #note { min-height:1.4em; }
    iframe { flex:1 1 auto; width:100%; border:0; background:#0b0d14; pointer-events:none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">RTN<span>Reviewer walkthrough</span></div>
    <h1 id="title">Saved examples on the returns desk</h1>
    <p id="body">This page walks through two frozen cards. Next and Back move the desk. Opening them does not call the model, and this page does not grade a new photo.</p>
    <p class="meta" id="note"></p>
    <div class="row">
      <button type="button" id="start">Start demo</button>
      <button type="button" class="ghost" id="back" hidden>Back</button>
      <button type="button" id="next" hidden>Next</button>
      <span id="count" hidden></span>
    </div>
  </header>
  <iframe id="desk" title="Returns desk" src="/?org=org_demo_alpha"></iframe>
  <script>
    const steps = [
      {
        title: "A photographed return",
        body: "Someone has to decide whether the unit is the named product, whether the required parts are shown, and which Amazon used grade fits what is visible. Signing in names the organisation. This walkthrough uses org_demo_alpha. The other organisation’s records stay closed."
      },
      {
        title: "Open RTN-019",
        body: "RTN-019 is the NOVA hair straightener. It is a saved evaluation, not a new grade. Opening this button does not call the model.",
        action: "show-019"
      },
      {
        title: "Checks, evidence, and policy_v1",
        body: "Identity, completeness, and condition are PASS. The Amazon grade is used_very_good. policy_v1 restocked a complete Very Good unit. The model did not choose restock."
      },
      {
        title: "Open RTN-001",
        body: "RTN-001 is the Samsung Book laptop. This card is also a saved evaluation. Opening it does not call the model.",
        action: "show-001"
      },
      {
        title: "Uncertain completeness stays pending review",
        body: "Identity passed. Completeness is UNCERTAIN because the adapter and box are not clearly shown. Condition is PASS, Very Good. UNCERTAIN is not a pass, so policy_v1 held the unit as pending_review."
      },
      {
        title: "Frozen evaluation numbers",
        body: "50 cases. 47 were graded, one model call each. Three genuinely had no photo: RTN-017, RTN-026, and RTN-032. On the 40 cases both labelers agreed and the model returned a grade: identity 37/40 (92.5%), completeness 30/40 (75.0%), condition 17/40 (42.5%). Ingestion errors 0. Model errors 0. These rates are this set only."
      },
      {
        title: "Condition is the weak check",
        body: "Of 23 condition mismatches, 14 are human Very Good and agent Like New. The miss is usually one step high on Amazon’s used scale."
      },
      {
        title: "Disposition policy-consistency",
        body: "40/40 saved agent dispositions were reproduced exactly by policy_v1 from the agent’s saved checks; there were zero true policy-mapping inconsistencies. 27/40 (67.5%) is not disposition accuracy. Disposition was not human-labeled."
      }
    ];
    let i = -1;
    const title = document.getElementById("title");
    const body = document.getElementById("body");
    const note = document.getElementById("note");
    const count = document.getElementById("count");
    const start = document.getElementById("start");
    const next = document.getElementById("next");
    const back = document.getElementById("back");
    const frame = document.getElementById("desk");

    function paint() {
      const step = steps[i];
      title.textContent = step.title;
      body.textContent = step.body;
      count.textContent = `${i + 1} / ${steps.length}`;
      note.textContent = step.action ? "Desk will open the frozen card." : "";
      if (step.action) {
        try {
          const doc = frame.contentDocument;
          const btn = doc && doc.getElementById(step.action);
          if (btn) btn.click();
        } catch (_) {}
      }
    }

    start.onclick = () => {
      i = 0;
      start.hidden = true;
      next.hidden = false;
      back.hidden = false;
      count.hidden = false;
      paint();
    };
    next.onclick = () => {
      if (i < steps.length - 1) { i += 1; paint(); }
    };
    back.onclick = () => {
      if (i > 0) { i -= 1; paint(); }
    };
  </script>
</body>
</html>
