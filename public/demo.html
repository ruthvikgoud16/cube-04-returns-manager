<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Returns Manager demo</title>
  <style>
    :root { color-scheme: light; --ink:#1c2430; --muted:#5c6570; --line:#d9d1c4; --paper:#f4efe6; --card:#fffdf8; --mark:#1f4d3a; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; }
    body { display:flex; flex-direction:column; font:16px/1.45 "Avenir Next", "Segoe UI", sans-serif; color:var(--ink); background:var(--paper); }
    header { flex:0 0 auto; border-bottom:1px solid var(--line); background:var(--card); padding:14px 18px 12px; }
    .brand { font:600 22px/1 "Iowan Old Style", Palatino, Georgia, serif; letter-spacing:-0.03em; }
    .brand span { display:block; margin-top:3px; font:11px/1.2 "Avenir Next", "Segoe UI", sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    h1 { font:600 18px/1.25 "Iowan Old Style", Palatino, Georgia, serif; margin:10px 0 6px; }
    p { margin:0; max-width:78ch; }
    .meta { color:var(--muted); font-size:13px; margin-top:6px; }
    .row { display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
    button { background:var(--mark); color:#f7f3ea; border:0; border-radius:999px; padding:10px 16px; cursor:pointer; font:15px/1.2 "Avenir Next", "Segoe UI", sans-serif; }
    button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
    button:disabled { opacity:.45; cursor:default; }
    #count { font-size:13px; color:var(--muted); }
    #note { min-height:1.4em; }
    iframe { flex:1 1 auto; width:100%; border:0; background:#fff; pointer-events:none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">RTN<span>Reviewer walkthrough</span></div>
    <h1 id="title">Saved examples on the returns desk</h1>
    <p id="body">This page walks through two frozen cards. Next and Back move the desk. Opening them does not call the model, and this page does not grade a new photo.</p>
    <p class="meta" id="note"></p>
    <div class="row">
      <button type="button" id="start">Start demo</button>
      <button type="button" class="ghost" id="back" hidden>Back</button>
      <button type="button" id="next" hidden>Next</button>
      <span id="count" hidden></span>
    </div>
  </header>
  <iframe id="desk" title="Returns desk" src="/"></iframe>
  <script>
    const steps = [
      {
        title: "A photographed return",
        body: "Someone has to decide whether the unit is the named product, whether the required parts are shown, and which Amazon used grade fits what is visible. Signing in names the organisation. This walkthrough uses org_demo_alpha. The other organisation’s records stay closed."
      },
      {
        title: "Open RTN-019",
        body: "RTN-019 is the NOVA hair straightener. It is a saved evaluation, not a new grade. Opening this button does not call the model."
      },
      {
        title: "Checks, evidence, and policy_v1",
        body: "Identity, completeness, and condition are PASS. The Amazon grade is used_very_good. policy_v1 restocked a complete Very Good unit. The model did not choose restock."
      },
      {
        title: "Open RTN-001",
        body: "RTN-001 is the Samsung Book laptop. This card is also a saved evaluation. Opening it does not call the model."
      },
      {
        title: "Uncertain completeness stays pending review",
        body: "Identity passed. Completeness is UNCERTAIN because the adapter and box are not clearly shown. Condition is PASS, Very Good. UNCERTAIN is not a pass, so policy_v1 held the unit as pending_review."
      },
      {
        title: "Frozen evaluation numbers",
        body: "50 cases. 47 were graded, one model call each. Three genuinely had no photo: RTN-017, RTN-026, and RTN-032. On the 40 cases both labelers agreed and the model returned a grade: identity 37/40 (92.5%), completeness 30/40 (75.0%), condition 17/40 (42.5%). Ingestion errors 0. Model errors 0. 47 calls, about 147,613 input tokens, 18,285 output tokens, about $0.72 at the script rates. These rates are this set only."
      },
      {
        title: "Condition is the weak check",
        body: "Of 23 condition mismatches, 14 are human Very Good and agent Like New. The miss is usually one step high on Amazon’s used scale."
      },
      {
        title: "Disposition policy-consistency",
        body: "40/40 saved agent dispositions were reproduced exactly by policy_v1 from the agent’s saved checks; there were zero true policy-mapping inconsistencies. 27/40 (67.5%) is not disposition accuracy. It is only agreement between policy_v1 applied to the agreed human checks and the saved agent dispositions. The disposition counts — restock 38, pending_review 8, refurbish 1, liquidate 0, dispose 0 — are not accuracy measurements. Disposition was not human-labeled."
      },
      {
        title: "Limit, and what to improve next",
        body: "These rates describe this evaluation set. They do not show that the same rates would hold on another set. The next improvement is the condition check, which sits one step high. Cohen’s kappa was not computed."
      }
    ];

    const frame = document.querySelector("#desk");
    const title = document.querySelector("#title");
    const body = document.querySelector("#body");
    const note = document.querySelector("#note");
    const start = document.querySelector("#start");
    const back = document.querySelector("#back");
    const next = document.querySelector("#next");
    const count = document.querySelector("#count");
    let index = -1;
    let busy = false;

    function doc() { return frame.contentDocument; }

    function ring(el) {
      const page = doc();
      if (!page || !el) return;
      el.scrollIntoView({ block: "center", inline: "nearest" });
      let mark = page.getElementById("walk-pointer");
      if (!mark) {
        mark = page.createElement("div");
        mark.id = "walk-pointer";
        mark.style.cssText = "position:fixed;width:52px;height:52px;margin:-26px 0 0 -26px;border:4px solid #1f4d3a;border-radius:50%;pointer-events:none;z-index:99999;box-shadow:0 0 0 8px rgba(31,77,58,.2);background:rgba(255,253,248,.25)";
        page.body.appendChild(mark);
      }
      const box = el.getBoundingClientRect();
      mark.style.display = "block";
      mark.style.left = (box.left + box.width / 2) + "px";
      mark.style.top = (box.top + box.height / 2) + "px";
    }

    function clearRing() {
      const mark = doc() && doc().getElementById("walk-pointer");
      if (mark) mark.style.display = "none";
    }

    function buttonNamed(label) {
      return [...doc().querySelectorAll("button")].find((el) => el.textContent.trim() === label);
    }

    function wait(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

    async function signIn() {
      const page = doc();
      const desk = page.querySelector("#desk");
      if (desk && !desk.hidden) return;
      buttonNamed("org_demo_alpha").click();
      for (let i = 0; i < 40; i++) {
        if (!page.querySelector("#desk").hidden) return;
        await wait(100);
      }
      throw new Error("Sign-in did not open the desk.");
    }

    function openSaved(id) {
      doc().querySelector(id).click();
      const card = doc().querySelector("#result");
      if (card) card.scrollIntoView({ block: "start" });
    }

    async function show(step) {
      const page = doc();
      if (!page || !page.querySelector("#login")) {
        note.textContent = "The desk has not loaded yet.";
        return;
      }
      note.textContent = "";
      if (step === 0) {
        ring(buttonNamed("org_demo_alpha"));
        return;
      }
      await signIn();
      if (step === 1) {
        openSaved("#show-019");
        ring(page.querySelector("#result"));
        return;
      }
      if (step === 2) {
        openSaved("#show-019");
        ring(page.querySelector("#result"));
        return;
      }
      if (step === 3) {
        openSaved("#show-001");
        ring(page.querySelector("#result"));
        return;
      }
      if (step === 4) {
        openSaved("#show-001");
        const checks = page.querySelectorAll("#result .check");
        ring(checks[1] || page.querySelector("#result"));
        return;
      }
      if (step === 5) {
        const scores = page.querySelector(".scores");
        if (scores) scores.scrollIntoView({ block: "center" });
        ring(scores);
        return;
      }
      if (step === 6) {
        const weak = page.querySelector(".score.weak");
        if (weak) weak.scrollIntoView({ block: "center" });
        ring(weak);
        return;
      }
      clearRing();
    }

    function render() {
      const step = steps[index];
      title.textContent = step.title;
      body.textContent = step.body;
      count.hidden = false;
      count.textContent = "Step " + (index + 1) + " of " + steps.length;
      back.hidden = false;
      next.hidden = false;
      start.hidden = true;
      back.disabled = index === 0;
      next.disabled = index === steps.length - 1;
      next.textContent = index === steps.length - 1 ? "Next" : "Next";
    }

    async function go(to) {
      if (busy) return;
      busy = true;
      back.disabled = true;
      next.disabled = true;
      index = to;
      render();
      try {
        if (!doc() || !doc().querySelector("#login")) {
          await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
        }
        const desk = doc().querySelector("#desk");
        if (to === 0 && desk && !desk.hidden) {
          await new Promise((resolve) => {
            frame.addEventListener("load", resolve, { once: true });
            frame.src = "/";
          });
        }
        await show(to);
      } catch (err) {
        note.textContent = err.message || "The desk step did not open.";
      }
      back.disabled = index === 0;
      next.disabled = index === steps.length - 1;
      busy = false;
    }

    start.onclick = () => go(0);
    back.onclick = () => go(index - 1);
    next.onclick = () => go(index + 1);
  </script>
</body>
</html>
